# Local and CI stack. The Zima deploy (KURO-T-0.7) runs the published images through Shipyard.
# The sidecar publishes no port (KURO-REQ-056): only kuro-server reaches it, over this network.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kuro
      POSTGRES_PASSWORD: kuro
      POSTGRES_DB: kuro
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kuro -d kuro']
      interval: 5s
      retries: 20
  kuro-cr:
    build: { context: crates/kuro-cr }
    image: ghcr.io/matdemers1/kuro-cr:local
  kuro-server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    image: ghcr.io/matdemers1/kuro-server:local
    # Development-only values. The Zima's real secrets are generated by deploy/zima-onboard.sh.
    environment:
      BASE_URL: http://localhost:3300
      KURO_CR_URL: http://kuro-cr:8080
      DATABASE_URL: postgresql://kuro:kuro@postgres:5432/kuro
      KURO_SECRET_KEY: ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2LW9u
      AUTH_PEPPER: cGVwcGVyLWRldi1vbmx5LXBlcHBlci1kZXYtb25seS1w
      SETUP_TOKEN: dev-setup-token-not-secret
    depends_on:
      postgres: { condition: service_healthy }
      kuro-cr: { condition: service_healthy }
    ports: ['3300:3300']
    volumes: [images:/data/images, backups:/data/backups]
volumes:
  pgdata:
  images:
  backups:
