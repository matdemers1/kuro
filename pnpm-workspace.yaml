packages:
  - apps/*
  - e2e

# Supply chain — the same policy Foreman and D3 Auth run. A package published in the last seven
# days is not installed (most malicious releases are found and pulled inside that window); a
# dependency whose provenance gets weaker than an earlier release is refused; a transitive
# dependency from anywhere but the registry is refused.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true

# pnpm 10 runs no install scripts unless named, so each one here is a decision.
# esbuild installs the binary tsx and Vite run on.
onlyBuiltDependencies:
  - esbuild
  # argon2 builds or verifies its native binding; without it, hashing segfaults.
  - argon2
  - '@prisma/engines'
# Refused: prisma's own postinstall (the package script runs `prisma generate` itself).
ignoredBuiltDependencies:
  - prisma

# prisma@7.10.0 (the CLI only) was published without the SLSA provenance 7.8.0–7.9.1 carried; its
# runtime packages at 7.10.0 have it. Foreman and D3 Auth verified this was a publishing slip, not a
# takeover (2026-09-16/17). Remove with the next Prisma upgrade.
trustPolicyExclude:
  - prisma@7.10.0
