name: CI

# Gated, cheapest first: lint + scan → unit → images. Every action is pinned to a commit SHA, never
# a tag — a tag is a mutable pointer. GitHub-hosted runners only: this repo is public (GL-003).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # KURO-REQ-057: nothing that looks like the owner's real Crunchyroll data or a credential.
      - name: Personal-data scan
        run: node scripts/scan-personal-data.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kuro
          POSTGRES_PASSWORD: kuro
          POSTGRES_DB: kuro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kuro -d kuro"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The suite refuses any database whose name does not end in _test, and recreates it each run.
      DATABASE_URL: postgresql://kuro:kuro@127.0.0.1:5432/kuro_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration drift check — schema.prisma and migrations/ must agree
        working-directory: apps/server
        env:
          SHADOW_DATABASE_URL: postgresql://kuro:kuro@127.0.0.1:5432/shadow
        run: |
          PGPASSWORD=kuro psql -h 127.0.0.1 -U kuro -d kuro -c 'CREATE DATABASE shadow;'
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
      # The backup tests dump and restore: the client tools must match the server's major version.
      - name: pg_dump and pg_restore are PostgreSQL 16
        run: pg_dump --version | grep -q ' 16\.' && pg_restore --version | grep -q ' 16\.'
      - run: pnpm --filter kuro-server test:integration

  # The exit demo is a property of the built thing: the server serving the built web app, driven in
  # a browser, with a local mock of D3 Auth (oidc-provider) for the second login path.
  e2e:
    needs: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kuro
          POSTGRES_PASSWORD: kuro
          POSTGRES_DB: kuro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kuro -d kuro"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://kuro:kuro@127.0.0.1:5432/kuro_e2e_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Keep the report when e2e failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  # The sidecar: GitHub's ubuntu image ships rustup, so no third-party toolchain action is needed.
  sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/kuro-cr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  images:
    needs: [e2e, sidecar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: kuro-server
            context: .
            file: apps/server/Dockerfile
          - name: kuro-cr
            context: crates/kuro-cr
            file: crates/kuro-cr/Dockerfile
    steps:
      # fetch-depth 0 so the trailer parse sees HEAD's own log entry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Shipyard reads these off the image: `migration` decides whether a failed deploy may be
      # auto-rolled back (a `contract` release never is), `schema` is what /health must report.
      - id: shipyard-labels
        name: Shipyard labels from the HEAD commit's trailer
        run: bash scripts/shipyard-labels.sh | tee -a "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/matdemers1/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
          labels: |
            dev.d3cloud.shipyard.migration=${{ steps.shipyard-labels.outputs.migration }}
            dev.d3cloud.shipyard.schema=${{ steps.shipyard-labels.outputs.schema }}
            dev.d3cloud.shipyard.env=BASE_URL,DATABASE_URL,KURO_SECRET_KEY,AUTH_PEPPER
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KURO_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
